name: rentalpro-demo

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Chay Start-Docker.ps1 de tao .env}"
      SQLCMDPASSWORD: "${MSSQL_SA_PASSWORD:?Chay Start-Docker.ps1 de tao .env}"
    volumes:
      - sql_data:/var/opt/mssql
      - ./database/seeds:/seeds:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-b", "-l", "3", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: "${MSSQL_SA_PASSWORD:?Chay Start-Docker.ps1 de tao .env}"
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/upgrades:/upgrades:ro
      - ./scripts/docker/prepare-db.sh:/init/prepare-db.sh:ro
    entrypoint: ["/bin/bash", "/init/prepare-db.sh"]
    restart: "no"

  web:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RENTALPRO_WEB_PORT:-5080}:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CarRental: "Server=sqlserver,1433;Database=CarRental;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    volumes:
      - app_data:/app/App_Data
      - web_keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  sql_data:
  app_data:
  web_keys:
